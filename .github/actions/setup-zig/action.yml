name: Set up Zig
description: >-
  Install the Zig release named by minimum_zig_version in build.zig.zon, after
  checking the archive against the pinned checksum. Upgrading Zig means
  updating that version and the checksum below together.
runs:
  using: composite
  steps:
    - name: Install Zig
      shell: bash
      env:
        # SHA-256 of zig-x86_64-linux-<minimum_zig_version>.tar.xz.
        ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
      run: |
        zig_version="$(sed -n 's/^[[:space:]]*\.minimum_zig_version = "\([^"]*\)",/\1/p' build.zig.zon)"
        if [ -z "${zig_version}" ]; then
          printf 'build.zig.zon has no minimum_zig_version\n' >&2
          exit 1
        fi
        archive_name="zig-x86_64-linux-${zig_version}.tar.xz"
        archive_path="${RUNNER_TEMP}/${archive_name}"
        curl --fail --location --silent --show-error \
          --output "${archive_path}" \
          "https://ziglang.org/download/${zig_version}/${archive_name}"
        printf '%s  %s\n' "${ZIG_SHA256}" "${archive_path}" | sha256sum --check
        tar --extract --file "${archive_path}" --directory "${RUNNER_TEMP}"
        printf '%s\n' "${RUNNER_TEMP}/zig-x86_64-linux-${zig_version}" >> "${GITHUB_PATH}"
    - name: Cache Zig packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/zig
        key: zig-global-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
        restore-keys: zig-global-${{ runner.os }}-
